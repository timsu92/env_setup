# Workspace-root ansible.cfg
# Used by: VS Code Ansible extension, ansible-lint, and running ansible-playbook from workspace root.
[defaults]
inventory          = ansible/inventory/
roles_path         = ansible/roles/
retry_files_enabled = False
stdout_callback    = default
result_format      = yaml
interpreter_python = auto_silent
host_key_checking  = False

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
