---
# Profile: Docker container (local execution)
# Target: localhost inside the container
- name: Provision Docker container
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  vars_files:
    - ../group_vars/container.yml

  roles:
    - role: common_base
    - role: vim
      vars:
        vim_profile: minimal
    - role: git
