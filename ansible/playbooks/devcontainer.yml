---
# Profile: Devcontainer
# Target: localhost (local execution inside container)
# Run: bin/setup-devcontainer
- name: Provision devcontainer
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  vars_files:
    - ../playbook_vars/local.yml

  roles:
    - role: common_base
    - role: vim
      vars:
        vim_profile: full
    - role: git
    - role: claude_code
    - role: fzf
    - role: htop
    - role: apt_reboot_if_required
