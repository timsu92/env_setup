---
# Profile: Proxmox LXC
# Target: lxc inventory group (push model via SSH)
# Run: bin/setup-lxc --host <IP>
- name: Provision Proxmox LXC
  hosts: lxc
  gather_facts: true
  become: true

  roles:
    - role: apt_nycu_mirror
    - role: apt_cacher_ng
    - role: common_base
    - role: proxmox_guest
    - role: vim
      vars:
        vim_profile: minimal
    - role: git
    - role: zsh
    - role: zplug
    - role: starship
    - role: tmux
