---
# Profile: WSL daily driver
# Target: localhost (local execution inside WSL)
# Run: bin/setup-vm --profile wsl
- name: Provision WSL daily driver
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  vars_files:
    - ../playbook_vars/local.yml

  roles:
    - role: apt_nycu_mirror
    - role: common_base
    - role: pigz
    - role: dns_over_tls
    - role: vim
      vars:
        vim_profile: minimal
    - role: git
    - role: tmux
    - role: zsh
    - role: zplug
    - role: starship
    - role: docker_rootful
    - role: docker_rootless
    - role: xpra
    - role: wsl_my_documents
    - role: claude_code
