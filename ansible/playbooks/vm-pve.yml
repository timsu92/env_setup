---
# Profile: Proxmox VM — base setup
# Target: vm inventory group (push model via SSH)
# Run: bin/setup-vm --host pve-vm-01
- name: Provision Proxmox VM base
  hosts: vm
  gather_facts: true
  become: true

  roles:
    - role: pve_cloud_init_dns
      vars:
        pve_cloud_init_dns_override_interface: "{{ vm_pve_dns_interface | default('') }}"
    - role: apt_cacher_ng
    - role: apt_nycu_mirror
    - role: common_base
    - role: proxmox_guest
    - role: vim
      vars:
        vim_profile: minimal
    - role: git
    - role: zsh
    - role: zplug
    - role: starship
    - role: tmux
    - role: nfs_client
    - role: sshd
    - role: docker_rootless
    # After docker_rootless: claude_code checks for a container runtime to
    # decide whether the SonarQube MCP server needs Java + the standalone JAR.
    - role: claude_code
    - role: fzf
    - role: htop
    - role: copy_fail_fix
    - role: dirty_frag_fix
    - role: apt_reboot_if_required
