---
# apt_nycu_mirror: configure apt to use NYCU (交通大學) mirror
# Source: docs/apt/設定nycu mirror.md
#
# When apt_cacher_ng_enabled=true, repositories point at apt-cacher-ng using
# the special /HTTPS/// upstream form. This makes apt-cacher-ng fetch from the
# NYCU mirror over HTTPS while still being able to cache the objects locally.
#
# Because APT sees apt-cacher-ng as the immediate origin in this mode, pinning
# must target "apt-cacher-ng" instead of the upstream mirror hostname.

- name: Set NYCU mirror for Ubuntu
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nycu.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] {{ apt_https_repo_prefix }}ubuntu.cs.nycu.edu.tw/ubuntu/ {{ ansible_facts["distribution_release"] }} main universe restricted multiverse
      deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] {{ apt_https_repo_prefix }}ubuntu.cs.nycu.edu.tw/ubuntu/ {{ ansible_facts["distribution_release"] }}-updates main universe restricted multiverse
      deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] {{ apt_https_repo_prefix }}ubuntu.cs.nycu.edu.tw/ubuntu/ {{ ansible_facts["distribution_release"] }}-backports main universe restricted multiverse
      deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] {{ apt_https_repo_prefix }}ubuntu.cs.nycu.edu.tw/ubuntu/ {{ ansible_facts["distribution_release"] }}-security main universe restricted multiverse
  when: ansible_facts["distribution"] == "Ubuntu"

- name: Set apt pin priority for NYCU Ubuntu mirror
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nycu
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: *
      Pin: origin "{{ apt_cacher_ng_host if apt_cacher_ng_enabled else 'ubuntu.cs.nycu.edu.tw' }}"
      Pin-Priority: 501
  when: ansible_facts["distribution"] == "Ubuntu"

- name: Set NYCU mirror for Debian
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nycu.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [arch=amd64 signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] {{ apt_https_repo_prefix }}debian.cs.nycu.edu.tw/debian/ {{ ansible_facts["distribution_release"] }} main non-free-firmware
      deb [arch=amd64 signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] {{ apt_https_repo_prefix }}debian.cs.nycu.edu.tw/debian/ {{ ansible_facts["distribution_release"] }}-updates main non-free-firmware
  when: ansible_facts["distribution"] == "Debian"

- name: Set apt pin priority for NYCU Debian mirror
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nycu
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: *
      Pin: origin "{{ apt_cacher_ng_host if apt_cacher_ng_enabled else 'debian.cs.nycu.edu.tw' }}"
      Pin-Priority: 501
  when: ansible_facts["distribution"] == "Debian"

- name: Update apt cache after mirror change
  ansible.builtin.apt:
    update_cache: true
