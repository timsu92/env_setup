---
# HTTPS URLs only: a freshly-provisioned target has no SSH key for GitHub
# under setup_user, so the git@github.com shorthand form used by
# `claude plugin marketplace add owner/repo` can fail there even when the
# target repo is a public one.
claude_code_marketplaces:
  - name: claude-plugins-official
    url: https://github.com/anthropics/claude-plugins-official.git
  - name: anthropic-agent-skills
    url: https://github.com/anthropics/skills.git

# "<plugin>@<marketplace>" strings, passed as-is to `claude plugin install`.
claude_code_plugins:
  - context7@claude-plugins-official
  - claude-md-management@claude-plugins-official
  - code-review@claude-plugins-official
  - pr-review-toolkit@claude-plugins-official
  - superpowers@claude-plugins-official
  - feature-dev@claude-plugins-official
  - explanatory-output-style@claude-plugins-official
  - learning-output-style@claude-plugins-official
  - document-skills@anthropic-agent-skills
  - frontend-design@claude-plugins-official
  - playwright@claude-plugins-official
  - typescript-lsp@claude-plugins-official
  - pyright-lsp@claude-plugins-official
  - clangd-lsp@claude-plugins-official
  - claude-code-setup@claude-plugins-official
  - sonarqube@claude-plugins-official
  - mattpocock-skills

claude_code_dir: "{{ setup_user_home }}/.claude"
claude_code_hook_dir: "{{ claude_code_dir }}/hooks"
claude_code_plugin_dir: "{{ claude_code_dir }}/plugins"
claude_code_skills_dir: "{{ claude_code_dir }}/skills"
claude_code_self_download_dir: "{{ claude_code_plugin_dir }}/self-download"

claude_code_hung_yi_lee_skill_version: 50aa282
claude_code_hung_yi_lee_skill_refspec: 50aa2823cee651ecd9fbfb56cb66455bb8e3a7b3

# sonarqube-cli. The official install.sh always installs "stable" and cannot be
# pinned, so the role downloads the release binary itself and verifies it with
# the .sha256 published next to it. Only the two glibc builds exist upstream.
claude_code_sonarqube_cli_version: 1.8.0.5274
claude_code_sonarqube_cli_dir: "{{ setup_user_home }}/.local/share/sonarqube-cli/bin"
claude_code_sonarqube_cli_platforms:
  x86_64: linux-x86-64
  aarch64: linux-arm64
claude_code_sonarqube_cli_platform: "{{ claude_code_sonarqube_cli_platforms[ansible_facts['architecture']] }}"
claude_code_sonarqube_cli_base_url: https://binaries.sonarsource.com/Distribution/sonarqube-cli
claude_code_sonarqube_cli_url: "{{ claude_code_sonarqube_cli_base_url }}/{{ claude_code_sonarqube_cli_version }}\
  /linux/sonarqube-cli-{{ claude_code_sonarqube_cli_version }}-{{ claude_code_sonarqube_cli_platform }}.bin"

# Self-hosted SonarQube Server that the CLI (and its MCP server) talks to.
claude_code_sonarqube_server: http://sonarqube:9000
# Optional SonarQube *user* token (project / global tokens do not work). When
# non-empty, Ansible owns claude_code_sonarqube_token_file and writes it there;
# when empty, an empty stub is deployed once and never overwritten, so a token
# filled in by hand survives re-runs. Set it in ansible/inventory/pve_hosts.yml
# (VM, LXC) or ansible/inventory/local.yml (WSL, devcontainer).
claude_code_sonarqube_token: ""
claude_code_sonarqube_token_file: "{{ setup_user_home }}/.config/zsh/non-interactive/15-sonarqube-cli.zsh"
claude_code_sonarqube_server_file: "{{ setup_user_home }}/.config/zsh/non-interactive/14-sonarqube-cli-server.zsh"

# SonarQube MCP server JAR, the fallback when no container runtime can run
# `sonar run mcp`. Needs Java 21+; Debian 12 has no openjdk-21 package.
claude_code_sonarqube_mcp_version: 1.27.0.4335
claude_code_sonarqube_mcp_dir: "{{ setup_user_home }}/.local/share/sonarqube-mcp"
claude_code_sonarqube_mcp_url: "https://binaries.sonarsource.com/Distribution/sonarqube-mcp-server/\
  sonarqube-mcp-server-{{ claude_code_sonarqube_mcp_version }}.jar"
claude_code_sonarqube_mcp_java_supported: >-
  {{ ansible_facts['distribution'] == 'Ubuntu'
     or (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] | int >= 13) }}
