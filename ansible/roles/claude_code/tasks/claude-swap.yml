---
- name: Check uv's tool directory
  ansible.builtin.command:
    cmd: ~/.local/bin/uv tool dir
  become: true
  become_user: "{{ setup_user }}"
  register: claude_code_uv_tool_dir
  changed_when: false

- name: Install claude-swap
  ansible.builtin.command:
    cmd: ~/.local/bin/uv tool install claude-swap
    creates: "{{ claude_code_uv_tool_dir.stdout }}/claude-swap"
  become: true
  become_user: "{{ setup_user }}"

# claude-swap has no completion of its own and its argparse parsers aren't
# reachable from outside (shtab/argcomplete have nothing to hook), so this file
# reads `claude-swap --help` and `list --json` when TAB is pressed. It therefore
# keeps up with upgrades by itself and needs no regeneration in the update script.
- name: Deploy zsh completion for claude-swap
  ansible.builtin.copy:
    src: _claude-swap
    dest: "{{ setup_user_home }}/.config/zsh/completions/_claude-swap"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"

- name: Deploy aptu update script for claude-swap
  ansible.builtin.copy:
    src: claude-swap.update.zsh
    dest: "{{ setup_user_home }}/.config/zsh/update/claude-swap.update.zsh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"
