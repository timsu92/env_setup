---
# What `/codex:setup` of the codex plugin does for you: make sure the `codex`
# CLI is installed. `codex login` is interactive (ChatGPT account or API key),
# so it is left to the user.
# nvm is not on PATH in a non-interactive shell, so source it first (same as
# roles/node/tasks/main.yml).
- name: Get installed Codex CLI version
  ansible.builtin.shell:
    cmd: >
      . "{{ setup_user_home }}/.nvm/nvm.sh" &&
      codex --version
  register: claude_code_codex_installed
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: "{{ setup_user }}"
  environment:
    HOME: "{{ setup_user_home }}"
    NVM_DIR: "{{ setup_user_home }}/.nvm"

- name: Install Codex CLI
  ansible.builtin.shell:
    cmd: >
      . "{{ setup_user_home }}/.nvm/nvm.sh" &&
      npm install -g @openai/codex@{{ claude_code_codex_version }}
  when: claude_code_codex_version not in (claude_code_codex_installed.stdout | default(''))
  become: true
  become_user: "{{ setup_user }}"
  environment:
    HOME: "{{ setup_user_home }}"
    NVM_DIR: "{{ setup_user_home }}/.nvm"
  changed_when: true

# Codex sandboxes every shell command with /usr/bin/bwrap. Where unprivileged
# user namespaces are restricted (Ubuntu >= 24.04), bwrap can't set the sandbox
# up and every command fails. AppArmor's bwrap-userns-restrict profile lets bwrap
# create the namespace but strips capabilities from everything it runs, so bwrap
# can't be used to get around the restriction. Ubuntu 24.04 ships it disabled in
# apparmor-profiles; from 25.10 the apparmor package enables it itself, as a
# conffile in /etc/apparmor.d. It attaches to /usr/bin/bwrap only, hence the
# bubblewrap package: without it Codex falls back to its bundled bwrap and the
# profile never applies.
# Containers read the host's sysctl but can't load profiles, so they're skipped.
- name: Check whether unprivileged user namespaces are restricted
  ansible.builtin.slurp:
    src: /proc/sys/kernel/apparmor_restrict_unprivileged_userns
  register: claude_code_codex_userns_restrict
  failed_when: false

- name: Let the Codex sandbox use bwrap under the user namespace restriction
  when:
    - (claude_code_codex_userns_restrict.content | default('') | b64decode | trim) == '1'
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'containerd', 'lxc', 'podman']
  block:
    - name: Install bubblewrap and the AppArmor extra profiles
      ansible.builtin.apt:
        name:
          - apparmor
          - apparmor-profiles
          - bubblewrap

    # Only 24.04 has it here. Later releases already enable it, and copying over
    # their conffile would make apt ask about it on every upgrade. Under --check
    # apparmor-profiles isn't really installed yet, so this is absent too.
    - name: Look for the disabled bwrap-userns-restrict extra profile
      ansible.builtin.stat:
        path: /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      register: claude_code_codex_bwrap_extra_profile

    # Copied rather than linked: this is how Ubuntu enables an extra profile,
    # and a later apparmor-profiles update reaches /etc on the next run.
    - name: Enable the bwrap-userns-restrict AppArmor profile
      when: claude_code_codex_bwrap_extra_profile.stat.exists
      ansible.builtin.copy:
        src: /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
        dest: /etc/apparmor.d/bwrap-userns-restrict
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      notify: Load the bwrap-userns-restrict AppArmor profile

# Codex reads a repo's instructions from AGENTS.md, and the repos here only have
# CLAUDE.md, so a Codex review would never see their rules. Codex also writes
# to config.toml itself, so the file is only touched when CLAUDE.md is missing
# from the top-level list, and only that list changes. Top level means before
# the first [table] header: a key after one belongs to that table, which is
# also why a new key goes at the top rather than the end.
- name: Read the Codex config
  ansible.builtin.slurp:
    src: "{{ setup_user_home }}/.codex/config.toml"
  register: claude_code_codex_config
  failed_when: false

- name: Find the top-level fallback list in the Codex config
  ansible.builtin.set_fact:
    claude_code_codex_fallback_line: >-
      {{ claude_code_codex_config.content | default('') | b64decode
      | regex_replace('(?ms)^\[.*', '')
      | regex_search('(?m)^[ \t]*project_doc_fallback_filenames[ \t]*=.*$')
      | default('', true) }}

- name: Let Codex read CLAUDE.md where a repo has no AGENTS.md
  when: claude_code_codex_fallback_line == ''
  block:
    - name: Create the Codex config directory
      ansible.builtin.file:
        path: "{{ setup_user_home }}/.codex"
        state: directory
        owner: "{{ setup_user }}"
        group: "{{ setup_user }}"
        mode: "0700"  # it holds auth.json

    - name: Add CLAUDE.md to Codex's fallback instruction files
      ansible.builtin.lineinfile:
        path: "{{ setup_user_home }}/.codex/config.toml"
        line: 'project_doc_fallback_filenames = ["CLAUDE.md"]'
        insertbefore: BOF
        create: true
        owner: "{{ setup_user }}"
        group: "{{ setup_user }}"
        mode: "0600"

- name: Add CLAUDE.md to the existing fallback list
  when:
    - claude_code_codex_fallback_line != ''
    - "'CLAUDE.md' not in claude_code_codex_fallback_line"
  vars:
    claude_code_codex_fallback_parts: >-
      {{ claude_code_codex_fallback_line
      | regex_search('^([^=]*=\s*\[)([^\]]*)(\].*)$', '\1', '\2', '\3') | default([], true) }}
    claude_code_codex_fallback_items: >-
      {{ (claude_code_codex_fallback_parts[1] | default('')) | trim | regex_replace(',$', '') | trim }}
    claude_code_codex_table_header: '\n\['
  block:
    # A list spread over several lines can't be edited safely with a regex.
    - name: Check that the fallback list fits on one line
      ansible.builtin.assert:
        that: claude_code_codex_fallback_parts | length == 3
        fail_msg: >-
          {{ setup_user_home }}/.codex/config.toml sets project_doc_fallback_filenames
          in a form this role can't edit ({{ claude_code_codex_fallback_line }}).
          Add "CLAUDE.md" to it by hand.

    - name: Append CLAUDE.md to Codex's fallback instruction files
      ansible.builtin.replace:
        path: "{{ setup_user_home }}/.codex/config.toml"
        regexp: "^{{ claude_code_codex_fallback_line | regex_escape }}$"
        replace: >-
          {{ claude_code_codex_fallback_parts[0] }}{{ claude_code_codex_fallback_items
          ~ (', ' if claude_code_codex_fallback_items else '') }}"CLAUDE.md"{{ claude_code_codex_fallback_parts[2] }}
        # Stop at the first table header (^ wouldn't match line starts here). With
        # no table, before must be left out: if it matches nothing, nothing changes.
        before: >-
          {{ claude_code_codex_table_header
          if (claude_code_codex_config.content | b64decode is search(claude_code_codex_table_header))
          else omit }}

- name: Deploy aptu update script for codex
  ansible.builtin.copy:
    src: codex.update.zsh
    dest: "{{ setup_user_home }}/.config/zsh/update/codex.update.zsh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"
