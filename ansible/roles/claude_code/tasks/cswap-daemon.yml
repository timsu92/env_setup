---
- name: Ensure ~/.cache directory exists
  ansible.builtin.file:
    path: "{{ setup_user_home }}/.cache"
    state: directory
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0755"

- name: Deploy cswap auto zsh snippet
  ansible.builtin.copy:
    src: interactive/62-cswap-auto.zsh
    dest: "{{ setup_user_home }}/.config/zsh/interactive/62-cswap-auto.zsh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"
