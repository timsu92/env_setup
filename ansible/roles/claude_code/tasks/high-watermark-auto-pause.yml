---
- name: Create hooks directory
  ansible.builtin.include_tasks:
    file: hooks-dir.yml

- name: Deploy high-watermark-auto-pause hook script
  ansible.builtin.copy:
    src: hooks/high-watermark-auto-pause.sh
    dest: "{{ claude_code_hook_dir }}/high-watermark-auto-pause.sh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0755"

# 691200 s is ~8 days: safely past the 7-day weekly-limit worst case plus the
# gate's own resume-time buffer.
- name: Register high-watermark-auto-pause hooks in settings.json
  ansible.builtin.script:
    cmd: >-
      install_hooks.bash {{ claude_code_hook_dir }}/high-watermark-auto-pause.sh
      PreToolUse:691200 UserPromptSubmit:691200 Stop
  become: true
  become_user: "{{ setup_user }}"
  register: claude_code_hooks_install
  changed_when: claude_code_hooks_install.rc == 0
  failed_when: claude_code_hooks_install.rc != 0 and claude_code_hooks_install.rc != 10
