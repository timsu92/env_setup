---
- name: Create skills directory
  ansible.builtin.include_tasks:
    file: skills-dir.yml

- name: Check whether hung-yi-lee-skill is already cloned
  ansible.builtin.stat:
    path: "{{ claude_code_skills_dir }}/hung-yi-lee/.git"
  register: claude_code_hung_yi_lee_skill_git_dir
  become: true
  become_user: "{{ setup_user }}"

- name: Get installed hung-yi-lee-skill revision
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ claude_code_skills_dir }}/hung-yi-lee"
  register: claude_code_hung_yi_lee_skill_head
  changed_when: false
  become: true
  become_user: "{{ setup_user }}"
  when: claude_code_hung_yi_lee_skill_git_dir.stat.exists

- name: Determine whether hung-yi-lee-skill needs updating
  ansible.builtin.set_fact:
    claude_code_hung_yi_lee_skill_needs_update: >-
      {{
        not claude_code_hung_yi_lee_skill_git_dir.stat.exists
        or (claude_code_hung_yi_lee_skill_head.stdout | default('')
            != claude_code_hung_yi_lee_skill_refspec)
      }}

- name: Clone hung-yi-lee-skill
  ansible.builtin.git:
    repo: https://github.com/voidful/hung-yi-lee-skill
    dest: "{{ claude_code_skills_dir }}/hung-yi-lee"
    version: "{{ claude_code_hung_yi_lee_skill_version }}"
    refspec: "{{ claude_code_hung_yi_lee_skill_refspec }}"
    depth: 1
    update: "{{ claude_code_hung_yi_lee_skill_needs_update }}"
    force: >-
      {{
        claude_code_hung_yi_lee_skill_git_dir.stat.exists
        and claude_code_hung_yi_lee_skill_needs_update
      }}
  become: true
  become_user: "{{ setup_user }}"

- name: Create venv for hung-yi-lee-skill
  ansible.builtin.command:
    cmd: ~/.local/bin/uv init .
    chdir: "{{ claude_code_skills_dir }}/hung-yi-lee"
    creates: "{{ claude_code_skills_dir }}/hung-yi-lee/pyproject.toml"
  become: true
  become_user: "{{ setup_user }}"

- name: Install dependencies for hung-yi-lee-skill
  ansible.builtin.command:
    cmd: ~/.local/bin/uv add 'youtube-transcript-api>=1.2,<2' 'networkx>=3.0' 'python-louvain>=0.16' yt-dlp
    chdir: "{{ claude_code_skills_dir }}/hung-yi-lee"
    creates: "{{ claude_code_skills_dir }}/hung-yi-lee/uv.lock"
  become: true
  become_user: "{{ setup_user }}"

- name: Update python paths in skill documentation to use venv
  ansible.builtin.replace:
    path: "{{ claude_code_skills_dir }}/hung-yi-lee/{{ item }}"
    regexp: 'python3 scripts/hungyi_kb\.py'
    replace: "{{ claude_code_skills_dir }}/hung-yi-lee/.venv/bin/python {{ claude_code_skills_dir }}/hung-yi-lee/scripts/hungyi_kb.py"
  loop:
    - AGENTS.md
    - SKILL.md
    - wiki/graph/GRAPH_REPORT.md
    - wiki/index.md
    - wiki/query-playbook.md
  become: true
  become_user: "{{ setup_user }}"
