---
# Shared by statusline.sh and hooks/high-watermark-auto-pause.sh, which both
# look for it next to themselves (~/.claude/), so either one can be installed
# alone and still finds it.
- name: Create Claude Code home directory
  ansible.builtin.include_tasks:
    file: claude-dir.yml

- name: Install hwap-helper script
  ansible.builtin.copy:
    src: hwap-helper.sh
    dest: "{{ claude_code_dir }}/hwap-helper.sh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0755"
