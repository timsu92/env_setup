---
- name: Create hooks directory
  ansible.builtin.include_tasks:
    file: hooks-dir.yml

- name: Install hwap-helper script
  ansible.builtin.include_tasks:
    file: hwap-helper.yml

- name: Install common-helpers library
  ansible.builtin.include_tasks:
    file: common-helpers.yml

- name: Create skills directory
  ansible.builtin.include_tasks:
    file: skills-dir.yml

- name: Deploy ideal-compact hook script
  ansible.builtin.copy:
    src: hooks/ideal-compact.sh
    dest: "{{ claude_code_hook_dir }}/ideal-compact.sh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0755"

- name: Create ideal-compact skill directories
  ansible.builtin.file:
    path: "{{ claude_code_skills_dir }}/{{ item }}"
    state: directory
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0755"
  loop:
    - ideal-compact-skip
    - ideal-compact-standby

- name: Deploy ideal-compact skills
  ansible.builtin.copy:
    src: "skills/{{ item }}/SKILL.md"
    dest: "{{ claude_code_skills_dir }}/{{ item }}/SKILL.md"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"
  loop:
    - ideal-compact-skip
    - ideal-compact-standby

# PostCompact may have to wait for a usage window to reset, so it gets the
# same ~8 day timeout as the gate (691200 s).
- name: Register ideal-compact hooks in settings.json
  ansible.builtin.script:
    cmd: >-
      install_hooks.bash {{ claude_code_hook_dir }}/ideal-compact.sh
      PostToolUse Stop Notification PreCompact PostCompact:691200 SessionStart UserPromptSubmit
  become: true
  become_user: "{{ setup_user }}"
  register: claude_code_ideal_compact_hooks_install
  changed_when: claude_code_ideal_compact_hooks_install.rc == 0
  failed_when: claude_code_ideal_compact_hooks_install.rc != 0 and claude_code_ideal_compact_hooks_install.rc != 10

- name: Deploy claude launcher zsh snippet
  ansible.builtin.copy:
    src: interactive/65-claude-screen.zsh
    dest: "{{ setup_user_home }}/.config/zsh/interactive/65-claude-screen.zsh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"
