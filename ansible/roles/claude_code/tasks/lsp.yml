---
# LSPs.
# Not only required to install Claude Code plugins, but only the toolchains.

# pyright-lsp (the PyPI package is `pyright`; it ships pyright-langserver)
- name: Install pyright-lsp
  ansible.builtin.command:
    cmd: ~/.local/bin/uv tool install pyright
    creates: ~/.local/bin/pyright-langserver
  become: true
  become_user: "{{ setup_user }}"

# clangd-lsp
- name: Install clangd-lsp
  ansible.builtin.apt:
    name: clangd
    state: present
  when: ansible_facts['os_family'] == 'Debian'

