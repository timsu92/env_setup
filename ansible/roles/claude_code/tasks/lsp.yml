# gopls-lsp
# Decide from the installed version (not `creates:`) so bumping
# claude_code_gopls_version upgrades. `go install` always reports changed.
- name: Get installed gopls version
  ansible.builtin.command:
    cmd: "{{ setup_user_home }}/go/bin/gopls version"
  register: claude_code_gopls_installed
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: "{{ setup_user }}"

- name: Install gopls-lsp
  ansible.builtin.command:
    cmd: "go install golang.org/x/tools/gopls@{{ claude_code_gopls_version }}"
  when: claude_code_gopls_version not in (claude_code_gopls_installed.stdout | default(''))
  become: true
  become_user: "{{ setup_user }}"
  environment:
    GOPATH: "{{ setup_user_home }}/go"
    PATH: "{{ setup_user_home }}/go/bin:/usr/local/go/bin:{{ ansible_facts['env']['PATH'] }}"
  changed_when: true
