---
- name: Check Claude Code existence
  ansible.builtin.stat:
    path: "{{ setup_user_home }}/.local/bin/claude"
  register: claude_code_installed

- name: Download Claude Code's installation script
  ansible.builtin.get_url:
    url: https://claude.ai/install.sh
    dest: /tmp/claude_install.sh
    mode: '0700'
  become: true
  become_user: "{{ setup_user }}"
  when: not claude_code_installed.stat.exists

- name: Install Claude Code
  ansible.builtin.command:
    cmd: "bash /tmp/claude_install.sh"
    creates: "{{ setup_user_home }}/.local/bin/claude"
  become: true
  become_user: "{{ setup_user }}"

- name: Remove Claude Code's installation script
  ansible.builtin.file:
    path: /tmp/claude_install.sh
    state: absent
  when: not claude_code_installed.stat.exists

- name: Install marketplaces and plugins
  ansible.builtin.include_tasks: plugins.yml

- name: Install claude-swap
  ansible.builtin.include_tasks: claude-swap.yml

- name: Install RTK
  ansible.builtin.include_tasks: rtk.yml

- name: Install winlab-skills
  ansible.builtin.include_tasks: winlab-skills.yml

- name: Install hung-yi-lee-skill
  ansible.builtin.include_tasks: hung-yi-lee-skill.yml

- name: Install cswap auto switch account daemon
  ansible.builtin.include_tasks: cswap-daemon.yml
