---
- name: Check RTK existence
  ansible.builtin.stat:
    path: "{{ setup_user_home }}/.local/bin/rtk"
  register: claude_code_rtk_installed

- name: Download RTK installation script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh
    dest: /tmp/install_rtk.sh
    mode: '0700'
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
  when: not claude_code_rtk_installed.stat.exists

- name: Install RTK
  ansible.builtin.command:
    cmd: "sh /tmp/install_rtk.sh"
    creates: "{{ setup_user_home }}/.local/bin/rtk"
  become: true
  become_user: "{{ setup_user }}"

- name: Remove RTK installation script
  ansible.builtin.file:
    path: /tmp/install_rtk.sh
    state: absent
  when: not claude_code_rtk_installed.stat.exists

- name: Check for Codex's existance
  ansible.builtin.stat:
    path: "{{ setup_user_home }}/.local/bin/codex"
  register: claude_code_codex
  changed_when: false

# `creates` takes one path, never a list: a list is stringified and globbed as
# "['a', 'b']", which matches nothing, so the command would run every time.
# RTK.md is the file every RTK version's `init -g` writes; v1.x no longer
# writes hooks/rtk-rewrite.sh (it registers `rtk hook claude` instead).
- name: Install RTK for Claude Code / Copilot
  ansible.builtin.command:
    cmd: "rtk init -g --auto-patch"
    creates: "{{ claude_code_dir }}/RTK.md"
  become: true
  become_user: "{{ setup_user }}"
  environment:
    PATH: "{{ setup_user_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Install RTK for Codex
  ansible.builtin.command:
    cmd: "rtk init -g --codex"
    creates: "{{ setup_user_home }}/.codex/RTK.md"
  become: true
  become_user: "{{ setup_user }}"
  when: claude_code_codex.stat.exists
  environment:
    PATH: "{{ setup_user_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Deploy aptu update script for rtk
  ansible.builtin.copy:
    src: rtk.update.zsh
    dest: "{{ setup_user_home }}/.config/zsh/update/rtk.update.zsh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"
