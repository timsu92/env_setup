---
# sonarqube-mcp: run the SonarQube MCP server (`mcp__sonarqube__*`) wherever
# it can run. `sonar run mcp` needs a container runtime; without one the
# standalone MCP server JAR needs Java 21+. The sonarqube-mcp wrapper picks
# between them each time Claude Code starts the server; this file only
# provides what the wrapper may need.

# Presence only: a rootless Docker daemon is a systemd user service that is
# usually not running during provisioning, so "works" cannot be checked here.
- name: Look for a container runtime
  ansible.builtin.shell:
    cmd: for runtime in docker podman nerdctl; do command -v "$runtime" && exit 0; done; exit 1
    executable: /bin/sh
  register: claude_code_sonarqube_container_runtime
  changed_when: false
  failed_when: false

- name: Explain that the SonarQube MCP server cannot be installed here
  ansible.builtin.debug:
    msg: >-
      Claude Code 的 SonarQube MCP 無法安裝：此環境沒有容器 runtime，備援方案（獨立 JAR）也因為沒有 Java 21 而無法使用
      （{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} 沒有 openjdk-21-jre-headless 套件）。
  when:
    - claude_code_sonarqube_container_runtime.rc != 0
    - not claude_code_sonarqube_mcp_java_supported | bool

- name: Install Java for the SonarQube MCP server JAR
  ansible.builtin.apt:
    name: openjdk-21-jre-headless
    state: present
  when:
    - claude_code_sonarqube_container_runtime.rc != 0
    - claude_code_sonarqube_mcp_java_supported | bool

- name: Create SonarQube MCP server directory
  ansible.builtin.file:
    path: "{{ claude_code_sonarqube_mcp_dir }}"
    state: directory
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0755"
  when:
    - claude_code_sonarqube_container_runtime.rc != 0
    - claude_code_sonarqube_mcp_java_supported | bool

# As for the CLI, a checksum makes get_url replace a JAR that does not match.
- name: Download SonarQube MCP server JAR
  ansible.builtin.get_url:
    url: "{{ claude_code_sonarqube_mcp_url }}"
    dest: "{{ claude_code_sonarqube_mcp_dir }}/sonarqube-mcp-server.jar"
    checksum: "sha256:{{ claude_code_sonarqube_mcp_url }}.sha256"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"
  when:
    - claude_code_sonarqube_container_runtime.rc != 0
    - claude_code_sonarqube_mcp_java_supported | bool

# Deployed everywhere: it chooses between container and JAR at run time.
- name: Deploy sonarqube-mcp wrapper
  ansible.builtin.copy:
    src: sonarqube-mcp
    dest: "{{ claude_code_sonarqube_mcp_wrapper }}"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0755"

# Warns at session start when the MCP server cannot start (see the script).
- name: Create hooks directory
  ansible.builtin.include_tasks:
    file: hooks-dir.yml

- name: Deploy sonarqube-mcp-check hook script
  ansible.builtin.copy:
    src: hooks/sonarqube-mcp-check.sh
    dest: "{{ claude_code_hook_dir }}/sonarqube-mcp-check.sh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0755"

- name: Register sonarqube-mcp-check hook in settings.json
  ansible.builtin.script:
    cmd: "install_hooks.bash {{ claude_code_hook_dir }}/sonarqube-mcp-check.sh SessionStart"
  become: true
  become_user: "{{ setup_user }}"
  register: claude_code_sonarqube_mcp_hook_install
  changed_when: claude_code_sonarqube_mcp_hook_install.rc == 0
  failed_when: claude_code_sonarqube_mcp_hook_install.rc != 0 and claude_code_sonarqube_mcp_hook_install.rc != 10

# The MCP entry must be named `sonarqube`: the plugin's skills and agent call
# mcp__sonarqube__*. `sonar integrate claude` (sonarqube-cli.yml, earlier in
# the same run) writes `sonarqube -> sonar run mcp`, which cannot start
# without a container runtime, so replace it with the wrapper. Read
# ~/.claude.json directly: `claude mcp get` starts the server to check on it.
- name: Read ~/.claude.json
  ansible.builtin.slurp:
    src: "{{ setup_user_home }}/.claude.json"
  register: claude_code_claude_json
  failed_when: false

- name: Find the command registered for the sonarqube MCP server
  ansible.builtin.set_fact:
    claude_code_sonarqube_mcp_registered: >-
      {{ (((claude_code_claude_json.content | default('e30=') | b64decode | from_json).mcpServers
         | default({})).sonarqube | default({})).command | default('') }}

- name: Remove the sonarqube MCP server that does not use the wrapper
  ansible.builtin.command:
    cmd: "{{ setup_user_home }}/.local/bin/claude mcp remove --scope user sonarqube"
  become: true
  become_user: "{{ setup_user }}"
  environment:
    HOME: "{{ setup_user_home }}"
  changed_when: true
  when:
    - claude_code_sonarqube_mcp_registered | length > 0
    - claude_code_sonarqube_mcp_registered != claude_code_sonarqube_mcp_wrapper

- name: Register the sonarqube MCP server through the wrapper
  ansible.builtin.command:
    cmd: >-
      {{ setup_user_home }}/.local/bin/claude mcp add --scope user sonarqube
      -- {{ claude_code_sonarqube_mcp_wrapper }}
  become: true
  become_user: "{{ setup_user }}"
  environment:
    HOME: "{{ setup_user_home }}"
  changed_when: true
  when: claude_code_sonarqube_mcp_registered != claude_code_sonarqube_mcp_wrapper
