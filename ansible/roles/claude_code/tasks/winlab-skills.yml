---
- name: Create user plugin directory
  ansible.builtin.include_tasks:
    file: self-download-dir.yml

- name: Create skills directory
  ansible.builtin.include_tasks:
    file: skills-dir.yml

- name: Download Winlab-skills
  ansible.builtin.git:
    repo: https://github.com/timsu92/winlab-skills.git
    dest: "{{ claude_code_self_download_dir }}/winlab-skills"
    version: 38f31a5
    refspec: 38f31a564c780dbec23ea061b01222f24ac95563
    depth: 1
  become: true
  become_user: "{{ setup_user }}"

- name: Symlink cc to Claude Skills
  ansible.builtin.file:
    src: "{{ claude_code_self_download_dir }}/winlab-skills/skills/cc"
    dest: "{{ claude_code_skills_dir }}/cc"
    state: link
  become: true
  become_user: "{{ setup_user }}"

- name: Symlink english-writing-review to Claude Skills
  ansible.builtin.file:
    src: "{{ claude_code_self_download_dir }}/winlab-skills/skills/english-writing-review"
    dest: "{{ claude_code_skills_dir }}/english-writing-review"
    state: link
  become: true
  become_user: "{{ setup_user }}"

- name: Symlink winlab-slides-guidelines to Claude Skills
  ansible.builtin.file:
    src: "{{ claude_code_self_download_dir }}/winlab-skills/skills/winlab-slides-guidelines"
    dest: "{{ claude_code_skills_dir }}/winlab-slides-guidelines"
    state: link
  become: true
  become_user: "{{ setup_user }}"

- name: Deploy aptu update script for winlab-skills
  ansible.builtin.copy:
    src: winlab-skills.update.zsh
    dest: "{{ setup_user_home }}/.config/zsh/update/winlab-skills.update.zsh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"
