---
- name: Install python3-apt for Debian-based systems
  ansible.builtin.package:
    name: python3-apt
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Collect installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Ensure curl or wget is installed
  ansible.builtin.package:
    name: curl
    state: present
  when:
    - "'curl' not in ansible_facts['packages']"
    - "'wget' not in ansible_facts['packages']"
