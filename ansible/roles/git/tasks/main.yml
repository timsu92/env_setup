---
# git: install git and configure global settings
# Sources: docs/git/*

- name: Install git
  ansible.builtin.apt:
    name: git
    state: present

- name: Deploy git settings block to ~/.gitconfig
  ansible.builtin.blockinfile:
    path: "{{ setup_user_home }}/.gitconfig"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: git"
    content: "{{ lookup('ansible.builtin.template', 'gitconfig.j2') }}"
    create: true
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0664"
