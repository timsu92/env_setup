---
# github_cli: install GitHub CLI from the official Debian apt repository

- name: Install github_cli prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gpg
    state: present

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download GitHub CLI archive keyring
  ansible.builtin.get_url:
    url: "{{ github_cli_keyring_url }}"
    dest: "{{ github_cli_keyring_path }}"
    mode: "0644"
    checksum: "{{ github_cli_keyring_checksum }}"

- name: Read key fingerprints from GitHub CLI keyring
  ansible.builtin.command: gpg --show-keys --with-colons {{ github_cli_keyring_path }}
  register: github_cli_keyring_info
  changed_when: false

- name: Validate expected GitHub CLI key fingerprints
  ansible.builtin.assert:
    that:
      - github_cli_expected_gpg_key_fingerprint in github_cli_keyring_info.stdout
    fail_msg: "Missing expected fingerprint in keyring: {{ github_cli_expected_gpg_key_fingerprint }}"

- name: Detect dpkg architecture for GitHub CLI apt repository
  ansible.builtin.command: dpkg --print-architecture
  register: github_cli_dpkg_arch
  changed_when: false

- name: Add GitHub CLI apt repository
  ansible.builtin.deb822_repository:
    name: "{{ github_cli_repo_file_name }}"
    types: deb
    uris: "{{ github_cli_repo_url }}"
    suites: "{{ github_cli_repo_suite }}"
    components: "{{ github_cli_repo_component }}"
    architectures: "{{ github_cli_dpkg_arch.stdout }}"
    signed_by: "{{ github_cli_keyring_path }}"
    state: present
    install_python_debian: true

- name: Remove legacy GitHub CLI apt repository source
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ github_cli_repo_file_name }}.list"
    state: absent

- name: Install GitHub CLI package
  ansible.builtin.apt:
    name: "{{ github_cli_package_name }}"
    state: present
    update_cache: true

# Same effect as `gh auth setup-git`: a blank helper first (makes git forget any
# broader credential.helper), then gh itself. Written into the shared
# ~/.gitconfig as our own marked block so it survives the git role and doesn't
# depend on it or on gh being logged in.
- name: Configure git credential helper for GitHub CLI
  ansible.builtin.blockinfile:
    path: "{{ setup_user_home }}/.gitconfig"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: github_cli"
    content: |
      {% for host in github_cli_git_credential_hosts %}
      [credential "{{ host }}"]
          helper =
          helper = !/usr/bin/gh auth git-credential
      {% endfor %}
    create: true
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0664"
