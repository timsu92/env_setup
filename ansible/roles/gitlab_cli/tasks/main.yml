---
# Gitlab CLI installed using WakeMeOps
#
# WakeMeOps's own install script at
# https://github.com/upciti/wakemeops/blob/main/assets/install_repository

- name: Remove legacy WakeMeOps apt repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/trusted.gpg.d/wakemeops-keyring.gpg
    - /etc/apt/sources.list.d/wakemeops.list

- name: Install gnupg2 to provide gpg
  ansible.builtin.apt:
    name: gnupg2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy WakeMeOps apt keyring
  ansible.builtin.copy:
    src: wakemeops-keyring.asc
    dest: /etc/apt/keyrings/wakemeops-keyring.asc
    owner: root
    group: root
    mode: "0644"

- name: Add WakeMeOps apt repository
  ansible.builtin.deb822_repository:
    name: wakemeops
    types: deb
    uris: http://deb.wakemeops.com/wakemeops/
    suites: stable
    components:
      - dev  # Gitlab needs this only. We can enable others if needed:
             # devops, secops, terminal, desktop
    architectures: "{{ ansible_facts['architecture'] }}"
    signed_by: /etc/apt/keyrings/wakemeops-keyring.asc
    enabled: true
    install_python_debian: true

# Ubuntu/Debian already carry an older glab in their own archives, so without
# this pin apt would keep preferring that one. At the same time, our APT cacher
# priority is set to 501, so if we leave WakeMeOps's origin at the default 500,
# apt will prefer the old archives over WakeMeOps's newer ones.
- name: Pin glab to the WakeMeOps apt repository
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/wakemeops-glab
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: glab
      Pin: origin "deb.wakemeops.com"
      Pin-Priority: 501

- name: Install Gitlab CLI
  ansible.builtin.apt:
    name: glab
    state: present
    update_cache: true

- name: Check current Gitlab CLI git protocol
  ansible.builtin.command: /usr/bin/glab config get git_protocol --global
  register: gitlab_cli_current_git_protocol
  become: true
  become_user: "{{ setup_user }}"
  check_mode: false
  changed_when: false

- name: Set Gitlab CLI git protocol
  ansible.builtin.command: /usr/bin/glab config set git_protocol {{ gitlab_cli_git_protocol }} --global
  become: true
  become_user: "{{ setup_user }}"
  when: gitlab_cli_current_git_protocol.stdout != gitlab_cli_git_protocol
  changed_when: true

- name: Check existing git credential helpers for Gitlab CLI remotes  # noqa: command-instead-of-module
  ansible.builtin.command: git config --global --get-all credential.{{ item }}.helper
  register: gitlab_cli_existing_credential_helpers
  become: true
  become_user: "{{ setup_user }}"
  check_mode: false
  changed_when: false
  failed_when: false
  when: gitlab_cli_git_auth_using_glab
  loop: "{{ gitlab_cli_git_auth_using_glab_remotes }}"

# `git config <key> ""` cannot be expressed via community.general.git_config
# (it rejects an empty value), so fall back to the raw command here. This
# blank entry is what makes git forget any broader credential.helper that
# would otherwise still apply to these remotes (see credential.<url>.* in
# git-config(1)) without touching credential.helper itself or any other
# remote's own credential.<url>.helper entries.
- name: Reset inherited git credential helpers for Gitlab CLI remotes  # noqa: command-instead-of-module
  ansible.builtin.command: git config --global --replace-all credential.{{ item.item }}.helper ""
  become: true
  become_user: "{{ setup_user }}"
  changed_when: true
  when:
    - gitlab_cli_git_auth_using_glab
    - item.rc != 0 or item.stdout_lines[0] != ""
  loop: "{{ gitlab_cli_existing_credential_helpers.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Set Gitlab CLI git auth using glab
  community.general.git_config:
    name: credential.{{ item }}.helper
    value: "!/usr/bin/glab auth git-credential"
    scope: global
    add_mode: add
    state: present
  become: true
  become_user: "{{ setup_user }}"
  when: gitlab_cli_git_auth_using_glab
  loop: "{{ gitlab_cli_git_auth_using_glab_remotes }}"
