---
# Gitlab CLI installed using WakeMeOps
#
# WakeMeOps's own install script at
# https://github.com/upciti/wakemeops/blob/main/assets/install_repository

- name: Remove legacy WakeMeOps apt repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/trusted.gpg.d/wakemeops-keyring.gpg
    - /etc/apt/sources.list.d/wakemeops.list

- name: Install gnupg2 to provide gpg
  ansible.builtin.apt:
    name: gnupg2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy WakeMeOps apt keyring
  ansible.builtin.copy:
    src: wakemeops-keyring.asc
    dest: /etc/apt/keyrings/wakemeops-keyring.asc
    owner: root
    group: root
    mode: "0644"

- name: Add WakeMeOps apt repository
  ansible.builtin.deb822_repository:
    name: wakemeops
    types: deb
    uris: http://deb.wakemeops.com/wakemeops/
    suites: stable
    components:
      - dev  # Gitlab needs this only. We can enable others if needed:
             # devops, secops, terminal, desktop
    architectures: "{{ ansible_facts['architecture'] }}"
    signed_by: /etc/apt/keyrings/wakemeops-keyring.asc
    enabled: true
    install_python_debian: true

# Ubuntu/Debian already carry an older glab in their own archives, so without
# this pin apt would keep preferring that one. At the same time, our APT cacher
# priority is set to 501, so if we leave WakeMeOps's origin at the default 500,
# apt will prefer the old archives over WakeMeOps's newer ones.
- name: Pin glab to the WakeMeOps apt repository
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/wakemeops-glab
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: glab
      Pin: origin "deb.wakemeops.com"
      Pin-Priority: 501

- name: Install Gitlab CLI
  ansible.builtin.apt:
    name: glab
    state: present
    update_cache: true

- name: Check current Gitlab CLI git protocol
  ansible.builtin.command: /usr/bin/glab config get git_protocol --global
  register: gitlab_cli_current_git_protocol
  become: true
  become_user: "{{ setup_user }}"
  check_mode: false
  changed_when: false

- name: Set Gitlab CLI git protocol
  ansible.builtin.command: /usr/bin/glab config set git_protocol {{ gitlab_cli_git_protocol }} --global
  become: true
  become_user: "{{ setup_user }}"
  when: gitlab_cli_current_git_protocol.stdout != gitlab_cli_git_protocol
  changed_when: true

# A blank helper first makes git forget any broader credential.helper that
# would otherwise still apply to these remotes (see credential.<url>.* in
# git-config(1)), then glab itself. Written into the shared ~/.gitconfig as our
# own marked block so it survives the git role. Turning
# gitlab_cli_git_auth_using_glab off removes the block again.
- name: Configure git credential helper for Gitlab CLI remotes
  ansible.builtin.blockinfile:
    path: "{{ setup_user_home }}/.gitconfig"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: gitlab_cli"
    content: |
      {% for remote in gitlab_cli_git_auth_using_glab_remotes %}
      [credential "{{ remote }}"]
          helper =
          helper = !/usr/bin/glab auth git-credential
      {% endfor %}
    create: true
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0664"
    state: "{{ 'present' if gitlab_cli_git_auth_using_glab else 'absent' }}"
