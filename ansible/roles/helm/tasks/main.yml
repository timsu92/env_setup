---
# helm: install Helm package manager for Kubernetes
# Source: docs/k8s/helm.md

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - gpg
      - python3-debian
    state: present

- name: Download Helm GPG key
  ansible.builtin.uri:
    url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
    return_content: true
  check_mode: false
  register: helm_gpg_key

- name: Dearmor Helm GPG key
  ansible.builtin.command:
    stdin: "{{ helm_gpg_key.content }}"
    cmd: gpg --dearmor --output /usr/share/keyrings/helm.gpg
    creates: /usr/share/keyrings/helm.gpg

- name: Add Helm apt repository
  ansible.builtin.deb822_repository:
    name: helm-stable-debian
    types: deb
    uris: "{{ apt_https_repo_prefix }}packages.buildkite.com/helm-linux/helm-debian/any/"
    suites: any
    components: main
    signed_by: /usr/share/keyrings/helm.gpg
    state: present

- name: Remove legacy Helm apt repository source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/helm-stable-debian.list
    state: absent

- name: Install helm
  ansible.builtin.apt:
    name: helm
    state: present
    update_cache: true
