---
# helm: install Helm package manager for Kubernetes
# Source: docs/k8s/helm.md

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - gpg
      - python3-debian
    state: present

- name: Download and dearmor Helm GPG key
  ansible.builtin.shell:
    cmd: >
      curl -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
      | gpg --dearmor
      | tee /usr/share/keyrings/helm.gpg > /dev/null
    creates: /usr/share/keyrings/helm.gpg

- name: Add Helm apt repository
  ansible.builtin.deb822_repository:
    name: helm-stable-debian
    types: deb
    uris: "{{ apt_https_repo_prefix }}packages.buildkite.com/helm-linux/helm-debian/any/"
    suites: any
    components: main
    signed_by: /usr/share/keyrings/helm.gpg
    state: present

- name: Remove legacy Helm apt repository source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/helm-stable-debian.list
    state: absent

- name: Install helm
  ansible.builtin.apt:
    name: helm
    state: present
    update_cache: true
