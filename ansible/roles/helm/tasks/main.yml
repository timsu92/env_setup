---
# helm: install Helm package manager for Kubernetes
# Source: docs/k8s/helm.md

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - gpg
    state: present

- name: Download and dearmor Helm GPG key
  ansible.builtin.shell:
    cmd: >
      curl -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
      | gpg --dearmor
      | tee /usr/share/keyrings/helm.gpg > /dev/null
    creates: /usr/share/keyrings/helm.gpg

- name: Add Helm apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
    filename: helm-stable-debian
    state: present

- name: Install helm
  ansible.builtin.apt:
    name: helm
    state: present
    update_cache: true
