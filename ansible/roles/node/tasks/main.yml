---
# node: install Node.js via nvm
# Sources: docs/js/node.md

- name: Install Node.js via nvm
  ansible.builtin.shell:
    cmd: >
      . "{{ setup_user_home }}/.nvm/nvm.sh" &&
      nvm install {{ node_install_args }}
  become: true
  become_user: "{{ setup_user }}"
  environment:
    HOME: "{{ setup_user_home }}"
    NVM_DIR: "{{ setup_user_home }}/.nvm"
  register: node_install_result
  changed_when: >-
    'is already installed' not in node_install_result.stdout and
    'is already installed' not in node_install_result.stderr

- name: Deploy aptu update script for node
  ansible.builtin.copy:
    src: node.update.zsh
    dest: "{{ setup_user_home }}/.config/zsh/update/node.update.zsh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"
