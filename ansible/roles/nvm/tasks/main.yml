---
# nvm: install NVM and zsh integration
# Sources: docs/js/nvm.md

- name: Install nvm prerequisites
  ansible.builtin.apt:
    name:
      - bash
      - curl
    state: present

- name: Install nvm
  ansible.builtin.shell:
    cmd: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_version }}/install.sh | bash  # noqa: command-instead-of-module
    creates: "{{ nvm_install_dir }}/nvm.sh"
  become: true
  become_user: "{{ setup_user }}"
  environment:
    HOME: "{{ setup_user_home }}"
    PROFILE: /dev/null
    BASH_ENV: /dev/null

- name: Ensure zsh snippet directories exist for nvm
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0755"
  loop:
    - "{{ setup_user_home }}/.config"
    - "{{ setup_user_home }}/.config/zsh"
    - "{{ setup_user_home }}/.config/zsh/non-interactive"
    - "{{ setup_user_home }}/.config/zsh/interactive"

- name: Deploy nvm non-interactive zsh snippet
  ansible.builtin.copy:
    src: non-interactive/10-nvm.zsh
    dest: "{{ setup_user_home }}/.config/zsh/non-interactive/10-nvm.zsh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"

- name: Deploy nvm interactive zsh snippet
  ansible.builtin.copy:
    src: interactive/61-nvm-auto-use.zsh
    dest: "{{ setup_user_home }}/.config/zsh/interactive/61-nvm-auto-use.zsh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"
