---
# pigz: install pigz (parallel gzip)
# Source: docs/其他/pigz.md
- name: Install pigz
  ansible.builtin.apt:
    name: pigz
    state: present

- name: Check if gzip is already a symlink to pigz
  ansible.builtin.command:
    cmd: /bin/gzip --version
  register: pigz_current_version
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: "{{ setup_user }}"

- name: Replace gzip with pigz symlink
  when: not ansible_check_mode and "pigz" not in (pigz_current_version.stdout | default(''))
  block:
    - name: Rename original gzip binary
      ansible.builtin.command:
        cmd: mv /bin/gzip /bin/gzip.bak
        creates: /bin/gzip.bak

    - name: Create pigz symlink at /bin/gzip
      ansible.builtin.file:
        src: /usr/bin/pigz
        dest: /bin/gzip
        state: link
