---
# proxmox_guest: prepare a Proxmox VM/LXC as a standard guest machine
# Source: docs/proxmox/2. 一般使用機器.md

- name: Confirm before configuring root's home directory
  ansible.builtin.pause:
    prompt: |
      setup_user resolved to 'root' — dotfiles and tooling would be installed
      into /root instead of a normal user account. Type 'yes' to continue
  register: proxmox_guest_root_confirm
  when: setup_user == 'root'

- name: Abort unless configuring root was explicitly confirmed
  ansible.builtin.assert:
    that: (proxmox_guest_root_confirm.user_input | default('')) | lower == 'yes'
    fail_msg: >-
      Aborted: setup_user is 'root'. Set setup_user in
      ansible/inventory/group_vars/<group>.yml.
  when: setup_user == 'root'

- name: Install base packages
  ansible.builtin.apt:
    name:
      - vim
      - mosh
      - sudo
    state: present

- name: Install qemu-guest-agent on non-LXC guests
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  when: ansible_facts["virtualization_type"] != 'lxc'

- name: Create systemd drop-in for qemu-guest-agent (enable at boot)
  ansible.builtin.file:
    path: /etc/systemd/system/qemu-guest-agent.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_facts["virtualization_type"] != 'lxc'

- name: Deploy qemu-guest-agent systemd override
  ansible.builtin.copy:
    src: qemu-ga-override.conf
    dest: /etc/systemd/system/qemu-guest-agent.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload and enable qemu-guest-agent
  when: ansible_facts["virtualization_type"] != 'lxc'

- name: Ensure qemu-guest-agent is enabled and started
  ansible.builtin.service:
    name: qemu-guest-agent
    enabled: true
    state: started
    daemon_reload: true
  when: ansible_facts["virtualization_type"] != 'lxc'

- name: Create user {{ setup_user }}
  ansible.builtin.user:
    name: "{{ setup_user }}"
    create_home: true
    groups: "{{ proxmox_guest_user_groups }}"
    append: true
    state: present

- name: Grant login access to setup_user
  ansible.builtin.include_tasks: login-access.yml
  when: ansible_user != setup_user
