---
# pve_cloud_init_dns: force systemd-networkd to merge DHCP-provided search
# domains into resolv.conf.
#
# cloud-init never renders nameservers into netplan on any of these distros
# (DHCP-only network config), so DNS server/domain resolution normally relies
# entirely on systemd-networkd's own DHCP client defaults. Debian trixie's
# systemd package defaults DHCPv4/DHCPv6 UseDomains to false, silently
# dropping the DHCP-provided search domain, while Ubuntu's systemd package
# merges it by default, so the same DHCP lease behaves differently per distro.
# This override forces UseDomains on for both protocols so the behavior is
# consistent everywhere.

- name: Check whether netplan directory exists
  ansible.builtin.stat:
    path: /etc/netplan
  register: pve_cloud_init_dns_override_netplan_dir

- name: Pick interface for DNS override
  ansible.builtin.set_fact:
    pve_cloud_init_dns_override_effective_interface: >-
      {{
        pve_cloud_init_dns_override_interface
        if (pve_cloud_init_dns_override_interface | default('') | length > 0)
        else ansible_facts["default_ipv4"]["interface"]
      }}
  when:
    - ansible_facts["service_mgr"] == 'systemd'
    - pve_cloud_init_dns_override_netplan_dir.stat.exists

- name: Deploy netplan DNS override
  ansible.builtin.template:
    src: 60-ansible-pve-dns.yaml.j2
    dest: "{{ pve_cloud_init_dns_override_filename }}"
    owner: root
    group: root
    mode: "0600"
  register: pve_cloud_init_dns_override_template
  when:
    - ansible_facts["service_mgr"] == 'systemd'
    - pve_cloud_init_dns_override_netplan_dir.stat.exists

- name: Apply netplan DNS override
  ansible.builtin.command: netplan apply
  changed_when: pve_cloud_init_dns_override_template.changed
  when:
    - ansible_facts["service_mgr"] == 'systemd'
    - pve_cloud_init_dns_override_netplan_dir.stat.exists
