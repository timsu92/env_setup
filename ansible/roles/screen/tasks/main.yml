---
# screen: install GNU screen and add config to ~/.screenrc
# screen reads /etc/screenrc first and then ~/.screenrc, so the block only adds to the system defaults.

- name: Install screen
  ansible.builtin.package:
    name: screen
    state: present

# The version decides whether 24-bit colour can be passed through. Under --check on a host
# without screen yet the command fails; the block then falls back to the pre-5.0 settings.
- name: Read the installed screen version
  ansible.builtin.command: screen --version
  register: screen_version_out
  changed_when: false
  failed_when: false
  check_mode: false

- name: Keep the screen version for the config block
  ansible.builtin.set_fact:
    screen_ver: "{{ (screen_version_out.stdout | default('') | regex_search('version ([0-9]+\\.[0-9]+)', '\\1') or ['0']) | first }}"

- name: Configure screen
  ansible.builtin.blockinfile:
    path: "{{ setup_user_home }}/.screenrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: screen"
    create: true
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0600"
    block: |
      # Draw full-screen programs on the alternate screen and restore the original screen after they exit.
      altscreen on

      # Programs inside see 256 colours (TERM=screen would make them fall back to 8 or 16).
      term screen-256color
      {% if screen_ver is version('5.0', '>=') %}
      # Pass 24-bit colour through to the outer terminal (screen 5.0 and later only).
      truecolor on
      {% endif %}

      startup_message off
