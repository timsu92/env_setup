# Enable mouse support
set -g mouse on

# Use vi key bindings in copy mode
setw -g mode-keys vi

# Toggle mouse mode with prefix + m
bind-key m setw -g mouse \; display "Mouse mode is #{?mouse,on,off}"

# Increase repeat-time slightly for key sequences
set-option -g repeat-time 300

# Reduce escape-time for neovim/vim compatibility
set -sg escape-time 10
