---
# tmux: install tmux and deploy ~/.tmux.conf
# Source: docs/tmux.md

- name: Install tmux
  ansible.builtin.apt:
    name: tmux
    state: present

- name: Deploy ~/.tmux.conf
  ansible.builtin.copy:
    src: tmux.conf
    dest: "{{ setup_user_home }}/.tmux.conf"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"
  become: true
  become_user: "{{ setup_user }}"
