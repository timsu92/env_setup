# vim: install vim, optionally deploy full vimrc setup
- name: Install vim
  ansible.builtin.apt:
    name: vim
    state: present

- name: Install vim full profile prerequisites
  ansible.builtin.apt:
    name: git
    state: present
  when: vim_profile == 'full'

- name: Install Node.js for full vim profile
  ansible.builtin.include_role:
    name: node
  when: vim_profile == 'full'

- name: Checkout vimrc repository
  ansible.builtin.git:
    repo: "{{ vim_repo_url }}"
    dest: "{{ vim_repo_dest }}"
    version: "{{ vim_repo_version }}"
    depth: 1
    update: true
  become: true
  become_user: "{{ setup_user }}"
  register: vim_vimrc_repo_checkout
  when: vim_profile == 'full'

- name: Run vimrc install.sh
  ansible.builtin.command:
    cmd: >-
      bash -lc
      '. "{{ setup_user_home }}/.nvm/nvm.sh" &&
      bash install.sh'
    chdir: "{{ vim_repo_dest }}"
  become: true
  become_user: "{{ setup_user }}"
  environment:
    HOME: "{{ setup_user_home }}"
    NVM_DIR: "{{ setup_user_home }}/.nvm"
  when:
    - vim_profile == 'full'
    - not ansible_check_mode
    - vim_vimrc_repo_checkout.changed

- name: Deploy aptu update script for vimrc
  # Deployed unconditionally (not gated on vim_profile == 'full'): the script
  # itself is a no-op when ~/vimrc isn't a git checkout, so it activates
  # automatically if a profile ever switches to the full vim profile without
  # needing the zsh role to be re-run.
  ansible.builtin.copy:
    src: vimrc.update.zsh
    dest: "{{ setup_user_home }}/.config/zsh/update/vimrc.update.zsh"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"
