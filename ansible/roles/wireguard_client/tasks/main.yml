---
# wireguard_client: install WireGuard and deploy wg0.conf
# Source: docs/wireguard.md
#
# Required vars (no default): wireguard_address, wireguard_server_pubkey, wireguard_endpoint,
# Optional vars (see defaults/main.yml): wireguard_allowedips, wireguard_dns
#                                        wireguard_mtu, wireguard_keepalive
#
# Keys are generated on the target host and persisted in /etc/wireguard/.
# After the play runs, this role prints the client PublicKey and PresharedKey
# so you can add them to the server's [Peer] block.

- name: Install wireguard-tools
  ansible.builtin.apt:
    name: wireguard
    state: present

- name: Ensure /etc/wireguard directory exists with secure permissions
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate WireGuard private key
  ansible.builtin.shell:
    cmd: wg genkey > /etc/wireguard/privatekey
    creates: /etc/wireguard/privatekey
  no_log: true

- name: Set secure permissions on private key file
  ansible.builtin.file:
    path: /etc/wireguard/privatekey
    owner: root
    group: root
    mode: "0600"

- name: Generate WireGuard preshared key
  ansible.builtin.shell:
    cmd: wg genpsk > /etc/wireguard/presharedkey
    creates: /etc/wireguard/presharedkey
  no_log: true

- name: Set secure permissions on preshared key file
  ansible.builtin.file:
    path: /etc/wireguard/presharedkey
    owner: root
    group: root
    mode: "0600"

- name: Read WireGuard private key
  ansible.builtin.slurp:
    src: /etc/wireguard/privatekey
  register: _wg_privatekey
  no_log: true

- name: Read WireGuard preshared key
  ansible.builtin.slurp:
    src: /etc/wireguard/presharedkey
  register: _wg_psk
  no_log: true

- name: Derive WireGuard public key from private key
  ansible.builtin.shell:
    cmd: wg pubkey < /etc/wireguard/privatekey
  register: _wg_pubkey
  changed_when: false

- name: Deploy /etc/wireguard/wg0.conf
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart wg-quick@wg0

- name: "Client keys — add these to the server [Peer] block"
  ansible.builtin.debug:
    msg:
      - "PublicKey    = {{ _wg_pubkey.stdout }}"
      - "PresharedKey = {{ _wg_psk.content | b64decode | trim }}"

- name: Delete private key file from the client for security
  ansible.builtin.file:
    path: /etc/wireguard/privatekey
    state: absent

- name: Delete preshared key file from the client for security
  ansible.builtin.file:
    path: /etc/wireguard/presharedkey
    state: absent
