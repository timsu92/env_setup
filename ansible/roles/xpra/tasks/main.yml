---
# xpra: install xpra remote desktop server/client
# Source: docs/Linux系統/xpra.md

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - wget
    state: present

- name: Download xpra GPG key
  ansible.builtin.get_url:
    url: https://xpra.org/xpra.asc
    dest: /usr/share/keyrings/xpra.asc
    mode: "0644"

- name: Add xpra apt repository
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/Xpra-org/xpra/master/packaging/repos/{{ ansible_facts['distribution_release'] }}/{{ repo }}.sources"
    dest: /etc/apt/sources.list.d/xpra.sources
    mode: "0644"

- name: Rewrite xpra deb822 repository to apt-cacher-ng HTTPS backend form
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/xpra.sources
    regexp: '(?m)^URIs:\s+https://(.*)$'
    replace: 'URIs: {{ apt_https_repo_prefix }}\1'
  when: apt_cacher_ng_enabled

- name: Enable Ubuntu universe repository
  ansible.builtin.apt_repository:
    repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts['distribution_release'] }} universe"
    state: present
  when: ansible_facts["distribution"] == "Ubuntu"

- name: Install xpra
  ansible.builtin.apt:
    name: xpra
    state: present
    update_cache: true
