# zsh: install zsh and deploy modular loaders/snippets
# Sources: docs/zsh/*

- name: Install zsh
  ansible.builtin.apt:
    name: zsh
    state: present

- name: Set zsh as default shell for {{ setup_user }}
  ansible.builtin.user:
    name: "{{ setup_user }}"
    shell: /bin/zsh

- name: Ensure zsh config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0755"
  loop:
    - "{{ setup_user_home }}/.config"
    - "{{ setup_user_home }}/.config/zsh"
    - "{{ setup_user_home }}/.config/zsh/non-interactive"
    - "{{ setup_user_home }}/.config/zsh/interactive"

- name: Deploy ~/.zshenv loader
  ansible.builtin.copy:
    src: zshenv
    dest: "{{ setup_user_home }}/.zshenv"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"

- name: Deploy ~/.zshrc loader
  ansible.builtin.copy:
    src: zshrc
    dest: "{{ setup_user_home }}/.zshrc"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: "0644"

- name: Deploy zsh interactive snippets
  ansible.builtin.copy:
    src: interactive/
    dest: "{{ setup_user_home }}/.config/zsh/interactive/"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: preserve
